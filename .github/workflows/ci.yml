name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitness_coach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fitness_coach_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rs 2>&1 | tee pytest.log

      # conftest skips the whole suite when Postgres is unreachable, which would
      # otherwise show up as a green run that tested nothing.
      - name: Fail if anything was skipped
        run: |
          if grep -qE "[0-9]+ skipped" pytest.log; then
            echo "::error::Some tests were skipped; a service was probably unreachable."
            exit 1
          fi
